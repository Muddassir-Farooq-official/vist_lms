{# The sign-in page's language choice: both options visible, the current one highlighted (static/js/i18n.js handles data-lang-set). #}
{% set cur = ui_lang(request) %}
<div class="lang-switch" role="group" aria-label="Language / زبان" translate="no">
  <svg class="lang-switch-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
  <button type="button" data-lang-set="en" lang="en" aria-pressed="{{ 'true' if cur != 'ur' else 'false' }}">English</button>
  <button type="button" data-lang-set="ur" lang="ur" aria-pressed="{{ 'true' if cur == 'ur' else 'false' }}">اردو</button>
</div>
