# Copy to /etc/nginx/sites-available/vist-lms, replace the domain, then follow the guide.
# Certbot will add the HTTPS part automatically.
server {
    listen 80;
    listen [::]:80;
    server_name lms.yourdomain.com;

    # CSV imports allow up to 20 MB; leave headroom for uploads.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}