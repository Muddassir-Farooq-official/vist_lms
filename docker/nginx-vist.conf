# Example nginx site for VIST LMS (host nginx in front of the Docker app on 127.0.0.1:8000).
# The important lines for audit SEC-02 are the proxy_set_header ones: nginx REPLACES X-Forwarded-For with the
# address it actually saw, so nothing a visitor sends in that header reaches the app.
server {
    listen 443 ssl http2;
    server_name lms.example.edu.pk;                       # change

    ssl_certificate     /etc/letsencrypt/live/lms.example.edu.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.example.edu.pk/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # not $proxy_add_x_forwarded_for
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name lms.example.edu.pk;
    return 301 https://$host$request_uri;
}
