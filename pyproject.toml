[project]
name = "vist-lms"
version = "0.1.0"
description = "VIST Learning Management System — production-grade modular monolith"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "greenlet>=3.0.3",
    "reportlab>=4.0",
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.8",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.5",
    "jinja2>=3.1.4",
    "structlog>=24.4.0",
    "email-validator>=2.2.0",
    "python-dotenv>=1.0.1",
    "rq>=1.16.2",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "numpy==2.1.3",
    "opencv-python-headless==4.10.0.84",   # offline face check for profile photos (app/selfservice/face_check.py)
]

[project.optional-dependencies]
dev = [
    "pypdf>=4.0",   # reads the text of generated PDFs in the result-card tests
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "black>=24.8.0",
    "faker>=28.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Real bugs only: syntax errors, undefined names, invalid comparisons, redefinitions.
# (Style rules are not enforced on this code base.)
select = ["E9", "F63", "F7", "F82", "F811"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["launch_guards: run with the production launch guards on (Step 2)"]