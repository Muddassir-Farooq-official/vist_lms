# Production stack for the VPS. The database is NOT here: it is the remote
# Postgres named in the server's .env (the REAL database).
name: vist-lms

# Each container keeps at most 3 x 10 MB of logs (Docker's default keeps them forever).
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    <<: *logging
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs "alembic upgrade head" against the REAL database, then exits.
  # scripts/deploy.sh runs it explicitly before restarting the app.
  migrate:
    <<: *logging
    image: vist-lms:latest
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    restart: "no"
    profiles: ["tools"]

  app:
    <<: *logging
    image: vist-lms:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # nginx runs on the host. Uvicorn must NOT rewrite the client address from X-Forwarded-For ("*" let any
      # visitor fake their IP and dodge the login limits - audit SEC-02). The app reads the header itself
      # (app/core/net.py), trusting only the proxies in TRUSTED_PROXIES and taking the address nginx appended.
      FORWARDED_ALLOW_IPS: "127.0.0.1"
    # Only reachable from the VPS itself; nginx exposes it to the internet.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./var/storage:/app/var/storage
    depends_on:
      redis:
        condition: service_healthy

  # Background worker for CSV imports (jobs queue in Redis).
  worker:
    <<: *logging
    image: vist-lms:latest
    restart: unless-stopped
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "imports"]
    # The image's own health check asks the web app on port 8000, which this container does not run, so Docker
    # called it "unhealthy" although it worked. Check what it really needs instead: Redis answers.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=3).ping()"]
      interval: 60s
      timeout: 10s
      retries: 3
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./var/storage:/app/var/storage
    depends_on:
      redis:
        condition: service_healthy

  # SMS sender (audit OPS-03): sends queued SMS (password reset codes, fee reminders, results) every 30 seconds and
  # queues the daily overdue-fee reminders. Without SMS_PROVIDER_URL in .env messages are only logged, never sent.
  sms:
    <<: *logging
    image: vist-lms:latest
    restart: unless-stopped
    command: ["python", "scripts/sms_sender.py"]
    # The image's own health check asks the web app on port 8000, which this container does not run, so Docker
    # called it "unhealthy" although it worked. Check what it really needs instead: Redis answers.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=3).ping()"]
      interval: 60s
      timeout: 10s
      retries: 3
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data: